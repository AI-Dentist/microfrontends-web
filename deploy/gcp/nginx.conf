server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    types { application/wasm wasm; }
    default_type application/octet-stream;

    add_header Access-Control-Allow-Origin "https://20-83-242-208.sslip.io" always;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location /remotes/clinical/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
