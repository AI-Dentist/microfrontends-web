server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache" always;

    location = /health { access_log off; return 200 "ok\n"; }
    location = /platform-config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # GCP is not deployed; never serve the SPA for a missing clinical module.
    location ^~ /remotes/clinical/ { return 503; }
    location ^~ /api/ { return 404; }
    location = /mcp { return 404; }
    location ~* \.(js|mjs|css|json|wasm|woff2?|ttf|otf|svg|png|jpe?g|webp|ico|map|webmanifest)$ {
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
